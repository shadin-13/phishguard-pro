{% extends "base.html" %}
{% block title %}Change password – PhishGuard Pro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="page-title">Change password</h1>
    <p class="page-sub">Update the password for your signed-in account.</p>
    <div class="card">
      <div class="card-body p-4">
        <form method="POST" autocomplete="off">
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <div class="password-wrap">
              <input type="password" id="current_password" name="current_password" class="form-control" required autocomplete="current-password">
              <button type="button" class="password-toggle" data-password-toggle="current_password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" class="form-control" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
              <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="confirm">Confirm new password</label>
            <div class="password-wrap">
              <input type="password" id="confirm" name="confirm" class="form-control" required minlength="8" autocomplete="new-password">
              <button type="button" class="password-toggle" data-password-toggle="confirm" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Update password</button>
        </form>
        <p class="text-center mt-3 mb-0 small">
          <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
