{% extends "base.html" %}
{% block title %}Forgot password – PhishGuard Pro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="page-title">Forgot password</h1>
    <p class="page-sub">Enter the email associated with your account. If it exists, a reset link will be issued.</p>
    <div class="card p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary w-100">Continue</button>
      </form>
      <p class="text-center mt-3 mb-0 small"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
