{% extends "base.html" %}
{% block title %}Set new password – PhishGuard Pro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="page-title">Set new password</h1>
    <p class="page-sub">Choose a new password for your account (at least 8 characters).</p>
    <div class="card p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" class="form-control" required minlength="8">
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm">Confirm</label>
          <div class="password-wrap">
            <input type="password" id="confirm" name="confirm" class="form-control" required minlength="8">
            <button type="button" class="password-toggle" data-password-toggle="confirm" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
